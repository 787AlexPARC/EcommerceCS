<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextFeet - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="barra">
        <h1>Next<span>Feet</span></h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Login</a>
        </nav>
    </div>

    <div class="contenedor-centrado">
        <form class="formulario">
            <h2>Crear Cuenta</h2>
            <div class="campo">
                <label>Nombres</label>
                <input type="text" placeholder="Alex" required>
            </div>
            <div class="campo">
                <label>Apellidos</label>
                <input type="text" placeholder="Parco" required>
            </div>
            <div class="campo">
                <label>Documento</label>
                <input type="text" placeholder="73978755" required>
            </div>
            <div class="campo">
                <label>Correo</label>
                <input type="email" placeholder="ejemplo@gmail.com" required>
            </div>
            <div class="campo">
                <label>Teléfono</label>
                <input type="tel" placeholder="987654321" required>
            </div>
            <div class="campo">
                <label>Contraseña</label>
                <input type="password" placeholder="******" required>
            </div>
            <button type="submit" class="btn-rojo btn-bloque">Registrarme</button>
            <p class="text-center mt-2">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
        </form>
    </div>

</body>
</html>
